{% extends "base.html" %}

{% block title %}Add Blog{% endblock title %}

{% block content %}

<form method='POST' action="{% url "add" %}">
    {% csrf_token %}
    <label>Title: <input type="text" name="title"></label>
    <label>Content: <textarea name="content"></textarea></label>
    <button type='submit'>Add-Blog</button>
</form>

{% endblock content %}
